<title>EduTrack apps have moved</title>
<script>
// Old address -> new address. The rest of the path is kept, so a saved link to a
// page opens the same page at the new address (after signing in there).
// If Cloudflare gave a project a different address, change it here.
var MOVED = {
  '/SAT-RW/': 'https://edutrack-sat-rw.pages.dev/',
  '/PSAT-8-9-R-W/': 'https://edutrack-psat-89-rw.pages.dev/',
  '/SAT-Maths/': 'https://edutrack-sat-math.pages.dev/'
};
(function () {
  var p = location.pathname;
  for (var old in MOVED) {
    var bare = old.slice(0, -1);
    if (p === bare || p.indexOf(old) === 0) {
      location.replace(MOVED[old] + p.slice(old.length) + location.search + location.hash);
      return;
    }
  }
})();
</script>
